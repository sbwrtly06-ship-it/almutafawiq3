name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Base Project
      run: flutter create . --org com.almutafawiq.app --project-name almutafawiq --overwrite

    - name: Force Real Main and UI Files
      run: |
        cat << 'EOL' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'home_dashboard.dart';

        void main() {
          runApp(const AlMutafawiqApp());
        }

        class AlMutafawiqApp extends StatelessWidget {
          const AlMutafawiqApp({Key? key}) : super(key: key);

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'المتفوق',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                primarySwatch: Colors.indigo,
                scaffoldBackgroundColor: const Color(0xFF0F172A),
              ),
              home: const HomeDashboardScreen(),
            );
          }
        }
        EOL

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
